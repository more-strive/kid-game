server {
    # 服务器是 nginx/1.18.0（Ubuntu），HTTP/2 要写在 listen 后面，
    # `http2 on;` 那条指令得 1.25.1+ 才有。用不上 HTTP/2 就把 http2 删掉。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name game.yft.design;

    # 证书路径（自有证书，放在 /var/www/ssl/）
    ssl_certificate     /var/www/ssl/game.yft.design.pem;
    ssl_certificate_key /var/www/ssl/game.yft.design.key;

    # CI 的部署目录，对应 deploy.yml 里的 DEPLOY_PATH
    root /var/www/html/kid-game;
    index index.html;

    # 大文件（14MB wasm / 5.6MB 模型）直出：零拷贝 + 响应头与文件合包发送
    sendfile on;
    tcp_nopush on;
    sendfile_max_chunk 2m;

    # 基础安全头
    add_header X-Content-Type-Options "nosniff" always;

    # ---------- gzip ----------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    # 构建时已由 scripts/precompress.mjs 预压出同名 .gz，这里直接读文件，
    # 不用每个请求现压 14MB wasm。该服务器已编入 http_gzip_static_module
    # （nginx -V 里有 --with-http_gzip_static_module），换机器时先确认这一项。
    gzip_static on;

    # ---------- 缓存策略 ----------

    # Vite 构建产物（/assets/），文件名带内容 hash，可永久强缓存
    location ^~ /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # WebAssembly：必须给对 MIME，否则 instantiateStreaming 会拒绝加载
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # public/ 里的资源（模型 / 音效 / 图标），文件名不带 hash，缓存 7 天
    location ~* \.(?:glb|gltf|fbx|obj|bin|task|mp3|ogg|wav|svg|png|jpe?g|webp|ico)$ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # .json 不缓存（游戏配置改动后立即生效，避免 7 天旧数据）
    location ~* \.json$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 入口 + SPA 深链接兜底（/games、/play/xxx 直接访问交给前端路由）
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.html;
    }
}
