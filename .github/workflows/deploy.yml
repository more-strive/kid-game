name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# gh-pages 分支由 Actions 推送
permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # GitHub Pages 的地址是 https://<user>.github.io/kid-game/，属于子路径部署。
      # 代码里 wasm / 模型 / 图标都靠 import.meta.env.BASE_URL 拼路径，这里必须给对，
      # 否则页面能打开但模型和 wasm 全 404（表现为 "Unable to open zip archive"）。
      BASE_PATH: /kid-game/
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # 不要写 version：pnpm 版本由 package.json 的 packageManager 字段决定（pnpm@11.12.0），
        # 两处同时指定会报 "Multiple versions of pnpm specified"。

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install and Build 🔧
        run: |
          pnpm install
          pnpm run build
          # SPA 深链接兜底：直接访问 /kid-game/games 时 GitHub Pages 返回 404.html，
          # 内容仍是 index.html，交给前端路由接管
          cp dist/index.html dist/404.html
          # 关掉 Jekyll，避免下划线开头的文件被忽略
          touch dist/.nojekyll

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # 推送到 gh-pages 分支
          folder: dist # 要部署的目录
          single-commit: true # 只保留一个提交，避免仓库被几十 MB 的产物撑爆
          clean: true # 先清空目标分支再放入本次产物

      # ------------------------------------------------------------------
      # 可选：同时部署到自有服务器，加上 secrets（SSH_HOST / SSH_PRIVATE_KEY）后取消注释。
      # 注意：服务器部署到根路径时 BASE_PATH 要改回 `/`，否则静态资源仍带 /kid-game/ 前缀；
      # 想两个目标共存，就再复制一份 build 步骤并给不同的 BASE_PATH 与 output 目录。
      # - name: Deploy via SCP
      #   uses: appleboy/scp-action@v0.1.6
      #   with:
      #     username: root
      #     host: ${{ secrets.SSH_HOST }}
      #     key: ${{ secrets.SSH_PRIVATE_KEY }}
      #     source: dist/
      #     target: /var/www/html/kid-game
      #     overwrite: true
      #     rm: true
