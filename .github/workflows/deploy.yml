name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # 部署在服务器根路径（如 https://your-domain/）时保持 `/`。
      # 若挂在子目录（如 https://your-domain/kid-game/），改成 `/kid-game/`，
      # 因为 wasm / 模型 / 图标都是按 import.meta.env.BASE_URL 拼路径的。
      BASE_PATH: /
      # 服务器上的站点目录，按实际情况改（下面 SCP 步骤的 target 用它）
      DEPLOY_PATH: /var/www/html/kid-game
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # 不要写 version：pnpm 版本由 package.json 的 packageManager 字段决定（pnpm@11.12.0），
        # 两处同时指定会报 "Multiple versions of pnpm specified"。

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install and Build 🔧
        run: |
          pnpm install --frozen-lockfile
          # build 链里已包含 vue-tsc 类型检查、vite build、预压缩（生成 .gz）
          pnpm run build
          # SPA 深链接兜底：直接访问 /games、/play/xxx 这类路径时，
          # 若 nginx 没配 try_files，就靠这份 404.html 交给前端路由接管
          cp dist/index.html dist/404.html

      - name: Report bundle size 📊
        run: |
          echo "产物总体积：$(du -sh dist | cut -f1)"
          echo "首屏关键文件："
          ls -lh dist/assets | awk '/ index-| vendor-/{print "  " $9 "  " $5}'

      - name: Deploy via SCP 🚀
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'dist/'
          target: ${{ env.DEPLOY_PATH }}
          # 去掉 dist/ 这一层，产物直接铺到 target 下；想保留 dist 子目录就改成 0
          strip_components: 1
          overwrite: true
          # rm: true 会先清空 target 目录再上传，target 写错等于删库，确认路径后再开
          rm: true

      # 可选：上传后重载 nginx（需要 sudo 免密）
      # - name: Reload nginx
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.SSH_HOST }}
      #     username: ${{ secrets.SSH_USER }}
      #     key: ${{ secrets.SSH_PRIVATE_KEY }}
      #     script: sudo nginx -s reload
